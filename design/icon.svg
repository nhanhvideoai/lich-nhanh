<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34497e"/><stop offset=".55" stop-color="#6a4c78"/><stop offset="1" stop-color="#d48a56"/>
    </linearGradient>
    <radialGradient id="glowA" cx=".2" cy=".15" r=".6"><stop offset="0" stop-color="#8fb0ff" stop-opacity=".55"/><stop offset="1" stop-color="#8fb0ff" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowB" cx=".9" cy=".95" r=".6"><stop offset="0" stop-color="#ffc27a" stop-opacity=".6"/><stop offset="1" stop-color="#ffc27a" stop-opacity="0"/></radialGradient>
    <linearGradient id="card" x1="0" y1="0" x2=".6" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".46"/><stop offset=".5" stop-color="#fff" stop-opacity=".16"/><stop offset="1" stop-color="#fff" stop-opacity=".28"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="1"/><stop offset=".35" stop-color="#fff" stop-opacity=".25"/><stop offset=".7" stop-color="#fff" stop-opacity=".12"/><stop offset="1" stop-color="#fff" stop-opacity=".85"/>
    </linearGradient>
    <linearGradient id="moon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset=".6" stop-color="#eef0ff"/><stop offset="1" stop-color="#c9d2f5"/>
    </linearGradient>
    <radialGradient id="sun" cx=".38" cy=".35" r=".7"><stop offset="0" stop-color="#fff3c8"/><stop offset=".55" stop-color="#ffc35c"/><stop offset="1" stop-color="#f08a3a"/></radialGradient>
    <radialGradient id="sunglow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ffc35c" stop-opacity=".7"/><stop offset="1" stop-color="#ffc35c" stop-opacity="0"/></radialGradient>
    <mask id="cres"><rect width="1024" height="1024" fill="#fff"/><circle cx="560" cy="530" r="150" fill="#000"/></mask>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="18"/></filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#glowA)"/>
  <rect width="1024" height="1024" fill="url(#glowB)"/>
  <!-- card shadow -->
  <rect x="232" y="246" width="560" height="580" rx="96" fill="#140e1a" opacity=".35" filter="url(#soft)" transform="translate(0 24)"/>
  <!-- glass card -->
  <rect x="232" y="236" width="560" height="580" rx="96" fill="url(#card)"/>
  <rect x="234" y="238" width="556" height="576" rx="94" fill="none" stroke="url(#rim)" stroke-width="5"/>
  <!-- header band -->
  <path d="M232 332 a96 96 0 0 1 96 -96 h368 a96 96 0 0 1 96 96 v28 h-560 z" fill="#fff" opacity=".9"/>
  <circle cx="392" cy="236" r="22" fill="#fff"/><circle cx="632" cy="236" r="22" fill="#fff"/>
  <rect x="381" y="196" width="22" height="64" rx="11" fill="#e9e4f2"/><rect x="621" y="196" width="22" height="64" rx="11" fill="#e9e4f2"/>
  <!-- sun (dương) -->
  <circle cx="628" cy="468" r="120" fill="url(#sunglow)"/><circle cx="628" cy="468" r="64" fill="url(#sun)"/>
  <!-- crescent moon (âm) -->
  <g mask="url(#cres)"><circle cx="470" cy="590" r="170" fill="url(#moon)"/></g>
  <!-- tiny stars -->
  <circle cx="672" cy="690" r="11" fill="#fff" opacity=".9"/><circle cx="724" cy="622" r="7" fill="#fff" opacity=".7"/>
</svg>
