name: Build APK

on:
  push:
    branches: [phim-thu]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build release APK
        env:
          KS_PASS: 'lichnhanh-tPPEPGmt3sm'
        run: gradle assembleRelease --no-daemon -Pvc=${{ github.run_number }} -Pvn=1.0.${{ github.run_number }}

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk phim-nhanh.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: phim-thu
          name: Phím Nhanh 1.0.${{ github.run_number }}
          body: Bản tự động từ lần cập nhật ${{ github.sha }}
          files: phim-nhanh.apk
          make_latest: false
          prerelease: true
