name: Thu dich
on:
  push:
    branches: [thu-dich]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - run: gradle :thudich:assembleRelease --no-daemon
        env:
          KS_PASS: 'lichnhanh-tPPEPGmt3sm'
      - run: cp thudich/build/outputs/apk/release/thudich-release.apk nhanh-dich.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: thu-dich
          name: Nhanh Dịch (bản thử)
          prerelease: true
          make_latest: false
          files: nhanh-dich.apk
