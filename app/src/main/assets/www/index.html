<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2a2522">
<title>Lịch Nhanh</title>
<style>
/* Layout: HyperOS-style — blurred wallpaper, liquid-glass panels; sheets grow out of the tapped element like app launch. Single dark look by choice. */
:root {
  --ink: #ffffff;
  --ink-2: rgba(255,255,255,.88);
  --ink-3: rgba(255,255,255,.66);
  --solid: linear-gradient(160deg, rgba(255,255,255,.95) 0%, rgba(255,255,255,.74) 55%, rgba(232,228,240,.62) 100%);
  --solid-ink: #1d1b1e;
  --accent: #3d82f6;
  --sun: #ff8b7e;
  --moon: #ffd27a;
  --good: #7be0a6;
  --shade: rgba(18,16,20,.30);
  --sheet: linear-gradient(170deg, rgba(255,255,255,.16), rgba(255,255,255,.05) 50%, rgba(255,255,255,.10)), rgba(34,30,38,.38);
  --r-panel: 22px;
  --r-tile: 13px;
  --spring: cubic-bezier(.2, 1.18, .32, 1);
  --ease: cubic-bezier(.3, .9, .3, 1);
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; margin: 0; }
body {
  font: 15px/1.35 "MiSans", system-ui, "Segoe UI", Roboto, sans-serif;
  color: var(--ink); background: #2a2522;
  padding-block: 12px 28px;
  padding-left: max(14px, env(safe-area-inset-left, 0px));
  padding-right: max(14px, env(safe-area-inset-right, 0px));
  overflow-x: hidden; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
  text-shadow: 0 1px 2px rgba(0,0,0,.35);
}
button { font: inherit; color: inherit; }

/* Wallpaper */
.wall { position: fixed; inset: 0; z-index: -2; background-size: cover; background-position: center; will-change: transform; transform: translateZ(0); }
.wall.blobs { background:
  radial-gradient(38% 30% at 18% 22%, #6f8fc9 0%, transparent 70%),
  radial-gradient(34% 28% at 82% 30%, #c7764a 0%, transparent 70%),
  radial-gradient(40% 30% at 30% 70%, #8a4c5a 0%, transparent 70%),
  radial-gradient(36% 30% at 78% 78%, #c9a04a 0%, transparent 70%),
  radial-gradient(30% 24% at 55% 50%, #3a5ea8 0%, transparent 70%), #3b332f; }
.shade { position: fixed; inset: 0; z-index: -1; background: var(--shade); }

/* Main screen — recedes (blur + shrink) when a sheet opens, like the home screen behind an app */
.wrap { max-width: 460px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px;
  transition: transform .42s var(--ease), opacity .42s var(--ease); transform-origin: 50% 40%; }
.wrap.behind { transform: scale(.93); opacity: .8; pointer-events: none; }

/* Liquid glass */
.glass {
  position: relative;
  background: linear-gradient(170deg, rgba(255,255,255,.20), rgba(255,255,255,.07) 45%, rgba(255,255,255,.13));
  border-radius: var(--r-panel);
  box-shadow: inset 1.5px 1.5px 0 rgba(255,255,255,.75), inset -1.2px -1.2px 0 rgba(255,255,255,.45),
    inset 0 0 0 1px rgba(255,255,255,.14), inset 0 0 18px rgba(255,255,255,.08), 0 6px 16px rgba(0,0,0,.18);
}
.round { border-radius: 14px; }
.solid, .btn.solid, .day.today, .chip, .seg button.on, .mo.on { text-shadow: none; }

/* Press feel: everything tappable sinks then springs back */
.btn, .day, .ev, .seg button, .tool { transition: transform .35s var(--spring), background .2s; }
.btn:active, .day:active, .ev:active, .seg button:active, .tool:active { transform: scale(.9); transition-duration: .12s; }

/* Load-in: control-center style — from blurred and slightly small to sharp, staggered */
@keyframes rise { from { opacity: 0; transform: scale(.92) translateY(10px); } }
.wrap > * { animation: rise .55s var(--spring) backwards; }
.wrap > *:nth-child(2) { animation-delay: .05s; } .wrap > *:nth-child(3) { animation-delay: .1s; }
.wrap > *:nth-child(4) { animation-delay: .15s; } .wrap > *:nth-child(5) { animation-delay: .2s; }
.wrap > *:nth-child(6) { animation-delay: .25s; }

/* Header */
.top { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 2px 4px 0; }
.top .sub { font-size: 15px; font-weight: 600; }
.top .right { color: var(--ink-2); font-size: 12.5px; margin-top: 2px; }
.top .right b { color: var(--moon); font-weight: 600; }
.top .seg { flex: none; width: 168px; }

.bar { display: flex; align-items: center; gap: 8px; padding: 5px; }
.bar .btn { width: 40px; height: 40px; font-size: 20px; }
.bar h1 { flex: 1; margin: 0; font-size: 17px; font-weight: 600; text-align: center; min-width: 0; cursor: pointer; }
.bar h1 small { display: block; font-size: 11px; font-weight: 500; color: var(--ink-2); }
.btn { border: 0; cursor: pointer; width: 52px; height: 52px; display: grid; place-items: center; font-size: 22px; background: none; }
.btn.pill { width: auto; padding: 0 18px; font-size: 14px; font-weight: 600; }
.btn.solid { background: var(--solid); color: var(--solid-ink); box-shadow: 0 6px 18px rgba(0,0,0,.18); }
.btn:focus-visible, .day:focus-visible, .ev:focus-visible, .tool:focus-visible, .seg button:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }

.seg { display: flex; padding: 3px; gap: 3px; }
.seg button { flex: 1; border: 0; background: none; padding: 7px 0; border-radius: 11px; font-weight: 600; font-size: 13px; color: var(--ink-2); cursor: pointer; }
.seg button.on { background: var(--solid); color: var(--solid-ink); box-shadow: 0 4px 12px rgba(0,0,0,.18); }

/* Month grid */
.month { padding: 14px 10px 12px; overflow: hidden; }
.dow, .days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.dow div { text-align: center; font-size: 13px; color: var(--ink-2); padding: 2px 0 8px; font-weight: 600; letter-spacing: .03em; }
.dow div:last-child { color: var(--sun); }
.days { row-gap: 6px; }
.days.out-l { animation: outL .18s ease-in forwards; } .days.out-r { animation: outR .18s ease-in forwards; }
.days.in-l { animation: inL .45s var(--spring); } .days.in-r { animation: inR .45s var(--spring); }
@keyframes outL { to { opacity: 0; transform: translateX(-30px); } }
@keyframes outR { to { opacity: 0; transform: translateX(30px); } }
@keyframes inL { from { opacity: 0; transform: translateX(40px); } }
@keyframes inR { from { opacity: 0; transform: translateX(-40px); } }
.day { background: transparent; border: 0; cursor: pointer; aspect-ratio: 1 / 1.2; max-width: 100%; min-width: 0;
  border-radius: var(--r-tile); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; position: relative; }
.day:hover { background: rgba(255,255,255,.12); }
.day .sn { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; }
.day .ln { font-size: 12px; font-weight: 500; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.day .ln.hi { color: var(--moon); font-weight: 600; }
.day.other { opacity: .45; }
.day.sun .sn { color: var(--sun); }
.day .dots { position: absolute; bottom: 4px; display: flex; gap: 3px; }
.day .dots i { width: 5px; height: 5px; border-radius: 50%; background: #fff; }
.day.today { background: var(--solid); color: var(--solid-ink); box-shadow: 0 6px 16px rgba(0,0,0,.2); }
.day.today .ln { color: rgba(29,27,30,.55); } .day.today .ln.hi { color: #b86a00; } .day.today.sun .sn { color: #d9463a; }
.day.selected:not(.today) { background: linear-gradient(170deg, rgba(255,255,255,.22), rgba(255,255,255,.08));
  box-shadow: inset 0 0 0 1.4px rgba(255,255,255,.55), inset 0 0 14px rgba(255,255,255,.12); }

/* Panels */
.panel { padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.panel h2 { margin: 0; font-size: 16px; font-weight: 600; }
.row { display: flex; align-items: center; gap: 12px; }
.chip { width: 58px; height: 58px; border-radius: 14px; background: var(--solid); color: var(--solid-ink);
  display: grid; place-items: center; text-align: center; line-height: 1; flex: none; }
.chip b { font-size: 24px; display: block; } .chip span { font-size: 10px; font-weight: 600; color: #d9463a; display: block; margin-top: 3px; }
.meta { color: var(--ink-2); font-size: 13px; } .meta2 { color: var(--ink-3); font-size: 12px; }
.ev { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 14px; cursor: pointer; text-align: left; border: 0; width: 100%; }
.ev .bar-c { width: 5px; align-self: stretch; border-radius: 4px; flex: none; }
.ev .t { flex: 1; min-width: 0; word-break: break-word; }
.ev .t b { display: block; font-size: 14px; font-weight: 600; }
.ev .t small { color: var(--ink-2); font-size: 12px; }
.ev.hol { cursor: default; }
.empty { color: var(--ink-3); font-size: 13px; }
.tools { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.tool { border: 0; cursor: pointer; aspect-ratio: 1; max-width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; border-radius: 18px; font-size: 11px; color: var(--ink-2); padding: 0; }
.tool span { font-size: 22px; color: var(--ink); line-height: 1; }
.count { display: flex; align-items: baseline; gap: 8px; }
.count b { font-size: 34px; font-weight: 300; font-variant-numeric: tabular-nums; }

/* Sheet — grows from the element that opened it, like an app launching from its icon */
.sheet-wrap { position: fixed; inset: 0; z-index: 50; }
.sheet-veil { position: absolute; inset: 0; background: rgba(0,0,0,.28); opacity: 0; transition: opacity .4s; }
.sheet-wrap.open .sheet-veil { opacity: 1; }
.sheet { position: absolute; left: 0; right: 0; margin-inline: auto; top: calc(env(safe-area-inset-top, 0px) + 18px);
  width: min(460px, calc(100% - 2 * max(14px, env(safe-area-inset-left, 0px))));
  max-height: calc(100% - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px) - 36px);
  transform-origin: 0 0; overflow: hidden; display: flex; flex-direction: column;
  background: var(--sheet); }
.sheet { isolation: isolate; }
/* Nền khung bật lên: dùng lại ảnh nền đã làm mờ sẵn, không làm mờ trực tiếp nên rất nhẹ */
.sheet-bg { position: absolute; inset: 0; z-index: -1; border-radius: inherit; background-size: cover; background-position: center; }
.sheet-bg::after { content: ""; position: absolute; inset: 0; border-radius: inherit;
  background: linear-gradient(170deg, rgba(255,255,255,.18), rgba(255,255,255,.06) 50%, rgba(255,255,255,.12)), rgba(30,26,34,.28);
  box-shadow: inset 1.5px 1.5px 0 rgba(255,255,255,.8), inset -1.2px -1.2px 0 rgba(255,255,255,.45), inset 0 0 22px rgba(255,255,255,.1); }
.sheet .inner { overflow-y: auto; padding: 20px 18px 22px; display: flex; flex-direction: column; gap: 14px;
  transition: opacity .3s .08s, filter .35s .06s; }
.sheet.fresh .inner { opacity: 0; }
.sheet h3 { margin: 0; font-size: 20px; font-weight: 600; flex: 1; min-width: 0; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field > label { font-size: 12px; color: var(--ink-2); font-weight: 600; letter-spacing: .03em; }
.in { font: inherit; color: var(--ink); border: 0; outline: 0; width: 100%; min-width: 0;
  background: rgba(255,255,255,.10); border-radius: 12px; padding: 13px 16px; box-shadow: inset 0 0 0 1.2px rgba(255,255,255,.25); }
.in:focus { box-shadow: inset 0 0 0 1.6px rgba(255,255,255,.75); }
.in::placeholder { color: var(--ink-3); }
select.in option { background: #2b2629; color: #fff; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.colors { display: flex; gap: 10px; flex-wrap: wrap; }
.colors button { width: 34px; height: 34px; border-radius: 10px; border: 0; cursor: pointer; box-shadow: inset 0 0 0 2px rgba(255,255,255,.25); }
.colors button.on { box-shadow: 0 0 0 3px #fff; }
.check { display: flex; align-items: center; gap: 10px; font-size: 14px; }
.check input { width: 20px; height: 20px; accent-color: var(--accent); }
.acts { display: flex; gap: 10px; }
.acts .btn { flex: 1; height: 50px; font-size: 16px; font-weight: 600; }
.btn.danger { color: #ff8b7e; }
.hours { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.hours div { padding: 8px 6px; border-radius: 10px; background: rgba(255,255,255,.08); text-align: center; font-size: 12px; }
.hours div b { display: block; font-size: 13px; }
.hours div.good { background: rgba(123,224,166,.18); box-shadow: inset 0 0 0 1px rgba(123,224,166,.45); }
.result { padding: 14px 16px; border-radius: 14px; background: rgba(255,255,255,.10); font-size: 15px; }
.result b { color: var(--moon); }
.list-scroll { display: flex; flex-direction: column; gap: 8px; }
.dayhead { font-size: 12px; color: var(--ink-2); font-weight: 600; padding: 8px 4px 0; letter-spacing: .03em; }
.foot { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
.upload { position: relative; overflow: hidden; height: 52px; width: 100%; font-size: 16px; font-weight: 600; }
.upload input { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; font-size: 0; }
.presets { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.pre { border: 0; cursor: pointer; aspect-ratio: 3 / 4; max-width: 100%; border-radius: 14px; display: flex; align-items: flex-end; justify-content: center; padding: 8px; box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.25); transition: transform .35s var(--spring); }
.pre span { font-size: 12px; font-weight: 600; text-shadow: 0 1px 4px rgba(0,0,0,.5); }
.pre.on { box-shadow: 0 0 0 3px #fff; }
.months { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.mo { border: 0; cursor: pointer; padding: 14px 0; border-radius: 12px; background: rgba(255,255,255,.10); font-weight: 600; font-size: 14px; transition: transform .35s var(--spring); }
.mo.on { background: var(--solid); color: var(--solid-ink); }
.pre:active, .mo:active { transform: scale(.92); transition-duration: .12s; }
.foot label { cursor: pointer; }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%) translateY(20px);
  padding: 12px 20px; font-size: 14px; font-weight: 600; opacity: 0; transition: all .4s var(--spring); z-index: 80; pointer-events: none; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* White parts are frosted glass too: translucent fill, bright rim, inner shine */
.btn.solid, .day.today, .chip, .seg button.on, .mo.on, .upload {
  box-shadow: inset 1.5px 1.5px 0 #fff, inset -1px -1px 0 rgba(255,255,255,.7), inset 0 0 14px rgba(255,255,255,.55), 0 6px 16px rgba(0,0,0,.22);
}
.hours div, .result, .in, .mo, .ev .x {
  box-shadow: inset 1.2px 1.2px 0 rgba(255,255,255,.4), inset -1px -1px 0 rgba(255,255,255,.18);
}
.in:focus { box-shadow: inset 0 0 0 1.6px rgba(255,255,255,.8); }
.hours div.good { box-shadow: inset 1.2px 1.2px 0 rgba(160,255,200,.6), inset 0 0 0 1px rgba(123,224,166,.45); }
/* Touch feedback: sink + brighten, light ripple from the finger, spring back */
.btn, .day, .ev, .seg button, .tool, .mo, .pre, .upload, .wk { position: relative; overflow: hidden; }
.pressed { transform: scale(.88) !important; filter: brightness(1.3); transition: transform .12s ease-out, filter .12s !important; }
.ripple { position: absolute; border-radius: 50%; pointer-events: none; z-index: 2;
  background: radial-gradient(circle, rgba(255,255,255,.6) 0%, rgba(255,255,255,.18) 45%, rgba(255,255,255,0) 70%);
  transform: translate(-50%, -50%) scale(0); animation: rip .6s cubic-bezier(.2,.8,.3,1) forwards; }
@keyframes rip { 60% { opacity: 1; } to { transform: translate(-50%, -50%) scale(1); opacity: 0; } }
.day.selected { animation: pop .45s var(--spring); }
@keyframes pop { from { transform: scale(.8); } }
.top .seg { width: 200px; }
.top .sub, .top .right { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brandname { font-size: 19px; font-weight: 700; letter-spacing: -.01em; }
.credit { text-align: center; font-size: 12px; color: var(--ink-3); padding: 2px 0 6px; }
.credit b { color: var(--ink-2); font-weight: 600; }
.sheet .inner > * { flex-shrink: 0; }
.seg button { font-size: 12px; }
.day.jp .sn { color: var(--sun); }
.day .hd { position: absolute; top: 5px; right: 6px; width: 4px; height: 4px; border-radius: 50%; background: var(--good); opacity: .9; }
.day.today .hd { background: #2f9e62; }
.tag { display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 8px; margin-left: 6px; vertical-align: 1px; }
.tag.good { background: rgba(123,224,166,.2); color: var(--good); }
.tag.bad { background: rgba(255,139,126,.16); color: var(--sun); }
.wk { display: flex; gap: 12px; align-items: flex-start; padding: 12px; border: 0; width: 100%; text-align: left; cursor: pointer; }
.wk .chip { width: 50px; height: 54px; }
.wk .chip b { font-size: 21px; }
.wk .body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.wk .line { font-size: 13px; display: flex; gap: 6px; align-items: center; min-width: 0; }
.wk .line i { width: 6px; height: 6px; border-radius: 50%; flex: none; }
.wk .line span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.wk.is-today { box-shadow: inset 0 0 0 1.6px rgba(255,255,255,.8), 0 6px 16px rgba(0,0,0,.18); }
.sw { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 14px; border-radius: 14px; background: rgba(255,255,255,.08); font-size: 14px; }
.sw small { display: block; color: var(--ink-3); font-size: 12px; }
.sw input[type="checkbox"] { appearance: none; -webkit-appearance: none; width: 46px; height: 28px; border-radius: 14px; background: rgba(255,255,255,.22); position: relative; flex: none; transition: background .25s; cursor: pointer; }
.sw input[type="checkbox"]::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; box-shadow: 0 2px 6px rgba(0,0,0,.3); transition: transform .35s var(--spring); }
.sw input[type="checkbox"]:checked { background: #4caf7a; }
.sw input[type="checkbox"]:checked::after { transform: translateX(18px); }
.sw input[type="time"] { width: auto; padding: 8px 10px; }
textarea.in { min-height: 90px; resize: vertical; font-size: 12px; }
.note { font-size: 12px; color: var(--ink-3); }
.ver { text-align: center; font-size: 12px; color: var(--ink-3); }
@media (prefers-reduced-motion: reduce) {
  *, *::before { animation: none !important; transition-duration: .01s !important; }
}
</style>
</head>
<body>
<div class="wall blobs" id="wall"></div>
<div class="shade"></div>

<div class="wrap" id="main">
  <div class="top">
    <div style="min-width:0"><div class="brandname">Lịch Nhanh</div><div class="right"><span id="todayline"></span> · <span id="lunarline"></span></div></div>
    <div class="glass round seg" role="tablist">
      <button id="tab-month" class="on" role="tab">Tháng</button>
      <button id="tab-week" role="tab">Tuần</button>
      <button id="tab-agenda" role="tab">Lịch trình</button>
    </div>
  </div>

  <div id="view-month" style="display:flex;flex-direction:column;gap:14px">
    <div class="glass bar">
      <button class="btn glass round" id="prev" aria-label="Tháng trước">‹</button>
      <h1 id="title" title="Bấm để chọn tháng, năm"></h1>
      <button class="btn glass round" id="next" aria-label="Tháng sau">›</button>
    </div>
    <section class="glass month" aria-label="Lịch tháng">
      <div class="dow"><div>T2</div><div>T3</div><div>T4</div><div>T5</div><div>T6</div><div>T7</div><div>CN</div></div>
      <div class="days" id="days"></div>
    </section>
    <section class="glass panel" id="daypanel"></section>
  </div>

  <div id="view-week" style="display:none;flex-direction:column;gap:14px">
    <div class="glass bar">
      <button class="btn glass round" id="wprev" aria-label="Tuần trước">‹</button>
      <h1 id="wtitle"></h1>
      <button class="btn glass round" id="wnext" aria-label="Tuần sau">›</button>
    </div>
    <div class="list-scroll" id="week"></div>
  </div>

  <div id="view-agenda" style="display:none;flex-direction:column;gap:14px">
    <section class="glass panel">
      <input class="in" id="search" type="search" placeholder="Tìm sự kiện..." autocomplete="off">
      <div class="list-scroll" id="agenda"></div>
    </section>
  </div>

  <section class="glass panel">
    <div class="tools">
      <button class="tool glass" id="t-add"><span>＋</span>Thêm</button>
      <button class="tool glass" id="t-conv"><span>⇄</span>Đổi ngày</button>
      <button class="tool glass" id="t-today"><span>◎</span>Hôm nay</button>
      <button class="tool glass" id="t-set"><span>⚙</span>Cài đặt</button>
    </div>
    <div class="row" style="justify-content:space-between">
      <div><div class="meta">Còn đến Tết <span id="tet-name"></span></div><div class="count"><b id="tet-days">--</b><span class="meta">ngày</span></div></div>
      <div class="meta2" id="tet-date" style="text-align:right"></div>
    </div>
  </section>

  <div class="credit"><b>Lịch Nhanh</b> · Tác giả Trần Thanh Nhanh</div>

</div>

<div class="toast glass round" id="toast"></div>

<script>
/* ===== Âm lịch Việt Nam (UTC+7) ===== */
const PI = Math.PI, TZ = 7;

const DOW = ['Chủ nhật','Thứ hai','Thứ ba','Thứ tư','Thứ năm','Thứ sáu','Thứ bảy'], DOW_S = ['CN','T2','T3','T4','T5','T6','T7'];

const REPEAT = { none:'Không lặp', daily:'Hằng ngày', weekly:'Hằng tuần', monthly:'Hằng tháng (dương)', yearly:'Hằng năm (dương)', lmonthly:'Hằng tháng (âm)', lyearly:'Hằng năm (âm) – giỗ, sinh nhật âm' };
const keyOf = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const fromKey = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
const strip = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
function load(k, f) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : f; } catch (e) { return f; } }

  Object.keys(old).forEach(k => (old[k] || []).forEach(t => { const [y, m, d] = k.split('-').map(Number); events.push(mkEvent({ title: t, start: keyOf(new Date(y, m - 1, d)) })); }));
  save('lichEvents2', events);

function mkEvent(o) { const d = fromKey(o.start), lu = toLunar(d.getDate(), d.getMonth() + 1, d.getFullYear());
  return Object.assign({ id: 'e' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), title: '', start: '', time: '', note: '', color: COLORS[0], repeat: 'none', remind: -1, lday: lu.day, lmonth: lu.month }, o, { lday: lu.day, lmonth: lu.month }); }
function occurs(ev, d) { const s = fromKey(ev.start); if (d < s) return false;

    case 'lmonthly': { const l = toLunar(d.getDate(), d.getMonth() + 1, d.getFullYear()); return l.day === ev.lday; }
    case 'lyearly': { const l = toLunar(d.getDate(), d.getMonth() + 1, d.getFullYear()); return !l.leap && l.day === ev.lday && l.month === ev.lmonth; }

const eventsOn = d => events.filter(e => occurs(e, d)).sort((a, b) => (a.time || '').localeCompare(b.time || ''));
/* Ngày lễ Nhật Bản (có nghỉ bù và ngày nghỉ quốc dân) */
const JP_CACHE = {};
function jpHolidays(y) { if (JP_CACHE[y]) return JP_CACHE[y]; const h = {}, key = dt => `${dt.getMonth() + 1}-${dt.getDate()}`;
  const add = (m, d, n) => { h[`${m}-${d}`] = n; };
  const nthMon = (m, n) => { const f = new Date(y, m - 1, 1).getDay(); return 1 + ((8 - f) % 7) + (n - 1) * 7; };
  const eq = (base) => Math.floor(base + 0.242194 * (y - 1980) - Math.floor((y - 1980) / 4));
  add(1, 1, 'Ngày đầu năm'); add(1, nthMon(1, 2), 'Ngày Thành nhân'); add(2, 11, 'Ngày Kiến quốc'); add(2, 23, 'Sinh nhật Thiên hoàng');
  add(3, eq(20.8431), 'Ngày Xuân phân'); add(4, 29, 'Ngày Showa'); add(5, 3, 'Ngày Hiến pháp'); add(5, 4, 'Ngày Xanh'); add(5, 5, 'Ngày Thiếu nhi');
  add(7, nthMon(7, 3), 'Ngày Biển'); add(8, 11, 'Ngày Núi'); add(9, nthMon(9, 3), 'Ngày Kính lão'); add(9, eq(23.2488), 'Ngày Thu phân');
  add(10, nthMon(10, 2), 'Ngày Thể thao'); add(11, 3, 'Ngày Văn hóa'); add(11, 23, 'Ngày Cảm tạ lao động');
  for (let t = new Date(y, 0, 2); t.getFullYear() === y; t.setDate(t.getDate() + 1)) {
    if (h[key(t)] || t.getDay() === 0) continue; const a = new Date(t), b = new Date(t); a.setDate(a.getDate() - 1); b.setDate(b.getDate() + 1);

  Object.keys(h).forEach(k => { const [m, d] = k.split('-').map(Number), t = new Date(y, m - 1, d); if (t.getDay() !== 0) return;
    const n = new Date(t); do { n.setDate(n.getDate() + 1); } while (h[key(n)] && n.getFullYear() === y); if (n.getFullYear() === y) h[key(n)] = 'Nghỉ bù'; });

    <div class="field"><label>NỀN CÓ SẴN</label><div class="presets">${PRESETS.map((p, i) => `<button class="pre${!wallState.src && !wallState.img && wallState.preset === i ? ' on' : ''}" data-i="${i}" style="background:${presetCss(p[1])}"><span>${p[0]}</span></button>`).join('')}</div></div>`, s => {
    let lv = lvNow;
    s.querySelectorAll('#w-lv button').forEach(b => b.onclick = async () => { lv = +b.dataset.lv; s.querySelectorAll('#w-lv button').forEach(x => x.classList.toggle('on', x === b));
      if (wallState.src) { wallState.lv = lv; save('lichWall2', wallState); await showWall(); toast(BLUR_LV[lv][0]); } });
    s.querySelectorAll('.pre').forEach(b => b.onclick = () => { wallState = { preset: +b.dataset.i }; save('lichWall2', wallState); showWall();
      s.querySelectorAll('.pre').forEach(x => x.classList.toggle('on', x === b)); toast('Đã đổi ảnh nền'); });
    s.querySelector('#w-file').onchange = e => { const f = e.target.files && e.target.files[0]; if (!f) return;
      readPhoto(f, async data => { wallState = { src: data, lv }; const ok = save('lichWall2', wallState); await showWall();
        s.querySelectorAll('.pre').forEach(x => x.classList.remove('on')); toast(ok ? 'Đã đổi ảnh nền' : 'Đã đổi ảnh nền (ảnh quá lớn, chưa lưu được lâu dài)'); }); }; }); }

const PRESS = '.btn, .day, .ev:not(.hol), .seg button, .tool, .mo, .pre, .upload, .wk';
document.addEventListener('pointerdown', e => { const el = e.target.closest(PRESS); if (!el) return;
  el.classList.add('pressed'); const r = el.getBoundingClientRect(), d = Math.max(r.width, r.height) * 2.2, sp = document.createElement('span');
  sp.className = 'ripple'; sp.style.width = sp.style.height = d + 'px'; sp.style.left = (e.clientX - r.left) + 'px'; sp.style.top = (e.clientY - r.top) + 'px';
  el.appendChild(sp); setTimeout(() => sp.remove(), 650);
  if (S.haptic) { try { if (NATIVE) Native.tick(); else if (navigator.vibrate) navigator.vibrate(6); } catch (_) {} }
  const up = () => setTimeout(() => el.classList.remove('pressed'), 90);
  el.addEventListener('pointerup', up, { once: true }); el.addEventListener('pointercancel', up, { once: true }); el.addEventListener('pointerleave', up, { once: true });
}, { passive: true });
/* ===== Nhắc việc: tính trước 400 ngày rồi giao cho Android đặt báo thức ===== */
function buildReminders() { const now = new Date(), out = []; let id = 1000;
  for (let i = -1; i < 400 && out.length < 150; i++) { const d = new Date(now.getFullYear(), now.getMonth(), now.getDate() + i);
    for (const e of eventsOn(d)) { if (e.remind == null || e.remind < 0) continue;
      const [hh, mm] = (e.time || S.allDayAt || '07:00').split(':').map(Number), at = new Date(d.getFullYear(), d.getMonth(), d.getDate(), hh, mm - e.remind);
      if (at <= now) continue; const lu = toLunar(d.getDate(), d.getMonth() + 1, d.getFullYear());
      const when = e.remind === 0 ? (e.time ? 'Bây giờ' : 'Hôm nay') : REMIND[String(e.remind)].replace('Trước ', 'Còn ');
      out.push({ id: id++, at: at.getTime(), title: e.title, body: `${when} · ${e.time ? e.time + ', ' : ''}${DOW[d.getDay()]} ${d.getDate()}/${d.getMonth() + 1} (âm ${lu.day}/${lu.month})${e.note ? ' · ' + e.note : ''}` }); } }
  return out; }
function syncReminders(askPerm) { if (!NATIVE) return;
  try { Native.schedule(JSON.stringify(buildReminders()));
    if (askPerm) { if (!Native.canNotify()) Native.askNotify(); else if (!Native.canExact()) { toast('Bật "Báo thức và lời nhắc" để nhắc đúng giờ'); setTimeout(() => Native.askExact(), 900); } } } catch (e) { console.warn(e); } }

/* ===== Cài đặt ===== */
function openSettings(origin) {
  sheet(origin, `<div class="row"><h3>Cài đặt</h3><button class="btn glass round" data-close aria-label="Đóng">✕</button></div>
    <button class="btn glass round pill" id="s-wall" style="width:100%;height:50px">Đổi ảnh nền</button>
    <div class="field"><label>HIỂN THỊ</label>
      <label class="sw"><span>Ngày lễ Việt Nam<small>Tết, rằm, giỗ Tổ, Trung Thu...</small></span><input type="checkbox" id="s-vn"${S.vn ? ' checked' : ''}></label>
      <label class="sw"><span>Ngày lễ Nhật Bản<small>Tô đỏ ngày nghỉ, có nghỉ bù</small></span><input type="checkbox" id="s-jp"${S.jp ? ' checked' : ''}></label>
      <label class="sw"><span>Rung khi chạm</span><input type="checkbox" id="s-hap"${S.haptic ? ' checked' : ''}></label></div>
    <div class="field"><label>NHẮC VIỆC</label>
      <label class="sw"><span>Giờ nhắc sự kiện cả ngày</span><input class="in" type="time" id="s-at" value="${S.allDayAt}"></label>
      <label class="sw"><span>Nhắc mặc định cho sự kiện mới</span><select class="in" id="s-def" style="width:auto;padding:8px 10px">${Object.keys(REMIND).sort((a, b) => a - b).map(k => `<option value="${k}"${+k === S.defRemind ? ' selected' : ''}>${REMIND[k]}</option>`).join('')}</select></label>
      ${NATIVE ? '<button class="btn glass round pill" id="s-perm" style="width:100%;height:46px">Kiểm tra quyền thông báo</button>' : '<div class="note">Nhắc việc chỉ chạy trong app trên điện thoại.</div>'}</div>
    <div class="field"><label>SAO LƯU DỮ LIỆU</label>
      <div class="note">Sao chép toàn bộ sự kiện thành một đoạn chữ, dán vào Ghi chú hoặc Zalo để cất. Khi đổi máy, dán lại vào ô dưới rồi bấm Khôi phục.</div>
      <div class="two"><button class="btn glass round pill" id="s-copy" style="height:46px">Sao chép</button><button class="btn glass round pill" id="s-restore" style="height:46px">Khôi phục</button></div>
      <textarea class="in" id="s-data" placeholder="Dán dữ liệu sao lưu vào đây"></textarea></div>
    <div class="ver" id="s-ver"><b style="color:var(--ink)">Lịch Nhanh</b>${NATIVE ? ' ' + (Native.version() || '') : ' (bản web)'}<br>Tác giả: Trần Thanh Nhanh<br>${events.length} sự kiện đã lưu</div>`, s => {
    const bind = (id, k) => s.querySelector(id).onchange = e => { S[k] = e.target.checked; saveS(); renderAll(); };
    bind('#s-vn', 'vn'); bind('#s-jp', 'jp'); bind('#s-hap', 'haptic');
    s.querySelector('#s-at').onchange = e => { if (e.target.value) { S.allDayAt = e.target.value; saveS(); syncReminders(); toast('Đã đổi giờ nhắc'); } };
    s.querySelector('#s-def').onchange = e => { S.defRemind = +e.target.value; saveS(); };
    s.querySelector('#s-wall').onclick = e => openWall(e.currentTarget);
    const perm = s.querySelector('#s-perm'); if (perm) perm.onclick = () => { if (!Native.canNotify()) { Native.askNotify(); return; } if (!Native.canExact()) { Native.askExact(); return; } toast('Quyền thông báo đã đủ'); };
    s.querySelector('#s-copy').onclick = async () => { const txt = JSON.stringify({ app: 'lich-nhanh', v: 1, events, settings: S });
      try { if (NATIVE) Native.copy(txt); else await navigator.clipboard.writeText(txt); toast('Đã sao chép ' + events.length + ' sự kiện'); }
      catch (e) { const ta = s.querySelector('#s-data'); ta.value = txt; ta.select(); toast('Chọn và sao chép đoạn chữ trong ô'); } };
    s.querySelector('#s-restore').onclick = () => { const ta = s.querySelector('#s-data'); let txt = ta.value.trim(); if (!txt && NATIVE) txt = Native.paste();
      try { const o = JSON.parse(txt); if (!o || !Array.isArray(o.events)) throw 0; const ids = new Set(events.map(e => e.id)); let n = 0;
        o.events.forEach(e => { if (e && e.title && e.start && !ids.has(e.id)) { events.push(mkEvent(e)); n++; } });
        save('lichEvents2', events); renderAll(); syncReminders(); ta.value = ''; toast(`Đã khôi phục ${n} sự kiện`); }
      catch (e) { toast('Dữ liệu không đúng, hãy dán lại đoạn sao lưu'); } };
  }); }

/* ===== Nút quay lại của Android, mở lại app ===== */
window.onNativeBack = () => { if (openSheet) { closeSheet(); return true; } if (tab !== 'month') { setTab('month'); return true; } return false; };
window.onNativeResume = () => { const k = keyOf(new Date()); if (window.__lastDay !== k) { window.__lastDay = k; renderAll(); } syncReminders(); };

function boot() { window.__lastDay = keyOf(new Date()); renderAll(); syncReminders(); setInterval(renderTop, 60000); }
boot();
</script>
</body>
</html>
